# Rock Paper Scissors Remaster — full local stack, no external services.
# Usage:  cp .env.example .env  &&  docker compose up --build
# Then open http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rps_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rps}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rps} -d ${POSTGRES_DB:-rps}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://rps:rps_dev_password@postgres:5432/rps?schema=public}
      SERVER_PORT: ${SERVER_PORT:-4000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-please}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${SERVER_PORT:-4000}:4000"

  client:
    build:
      context: ./client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
